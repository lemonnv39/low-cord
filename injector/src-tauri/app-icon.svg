<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- low-cord : fond carré arrondi noir -->
  <rect width="1024" height="1024" rx="228" fill="#050505"/>
  <!-- "l" minuscule (montant) posé sur une ligne basse : le "low" -->
  <rect x="352" y="232" width="112" height="456" rx="56" fill="#ffffff"/>
  <rect x="232" y="732" width="560" height="64" rx="32" fill="#ffffff"/>
  <!-- point d'accroche (le "cord" qui part de la ligne) -->
  <circle cx="672" cy="620" r="56" fill="#ffffff"/>
</svg>
