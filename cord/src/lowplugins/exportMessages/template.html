* { box-sizing: border-box; margin: 0; padding: 0; }

.side-foot { padding: 12px 16px; border-top: 1px solid var(--line); color: var(--faint); font-size: 11px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* ── Zone principale ── */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--bg); }

.search { display: flex; align-items: center; gap: 6px; width: 340px; max-width: 45vw; height: 34px; padding: 0 6px 0 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg-elev); color: var(--muted); }
.search:focus-within { border-color: var(--faint); }
.search svg { width: 16px; height: 16px; flex: none; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font: inherit; font-size: 14px; }
.search-count { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.search .icon-btn { width: 24px; height: 24px; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 0 28px; scroll-behavior: auto; }
.scroll, .side-scroll { scrollbar-width: thin; scrollbar-color: var(--bg-soft) transparent; }
.start { padding: 28px 22px 18px; }
.start h1 { color: var(--text-strong); font-size: 26px; line-height: 1.2; }
.start p { margin-top: 6px; color: var(--muted); }

.day { position: relative; display: flex; align-items: center; margin: 22px 18px 8px; color: var(--muted); font-size: 12px; font-weight: 600; }
.day::before, .day::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.day span { padding: 0 10px; }
.group { content-visibility: auto; contain-intrinsic-size: auto 64px; }
.msg { position: relative; display: grid; grid-template-columns: 56px 1fr; padding: 2px 18px 2px 0; }
.msg:hover { background: var(--bg-hover); }
.msg.first { margin-top: 16px; padding-top: 4px; }
.msg.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 40% { background: var(--flash); } 100% { background: transparent; } }
.gutter { display: flex; justify-content: center; }
.avatar { width: 40px; height: 40px; margin-top: 2px; border-radius: 50%; object-fit: cover; cursor: pointer; background: var(--bg-soft); }
.avatar:hover { box-shadow: 0 0 0 2px var(--line); }
.hover-time { visibility: hidden; margin-top: 3px; color: var(--faint); font-size: 10px; font-variant-numeric: tabular-nums; }
.msg:hover .hover-time { visibility: visible; }
.body { min-width: 0; }
.head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
.name { color: var(--text-strong); font-weight: 600; cursor: pointer; }
.name:hover { text-decoration: underline; }
.badge { padding: 0 5px; border-radius: 4px; background: #5865f2; color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; }
.time { color: var(--faint); font-size: 12px; }

.pin { color: var(--muted); font-size: 11px; margin-left: 6px; }
.reply { display: flex; align-items: center; gap: 6px; margin: 0 0 3px; padding-left: 56px; color: var(--muted); font-size: 13px; cursor: pointer; position: relative; overflow: hidden; white-space: nowrap; }
.reply::before { content: ""; position: absolute; left: 34px; top: 9px; width: 22px; height: 10px; border-left: 2px solid var(--faint); border-top: 2px solid var(--faint); border-top-left-radius: 6px; opacity: .6; }
.reply img { width: 16px; height: 16px; border-radius: 50%; object-fit: cover; flex: none; }
.reply b { color: var(--text-strong); font-weight: 600; flex: none; }
.reply span { overflow: hidden; text-overflow: ellipsis; }
.reply:hover span { color: var(--text); }
.system { display: grid; grid-template-columns: 56px 1fr; padding: 4px 18px 4px 0; color: var(--muted); font-size: 14px; }
.system .gutter svg { width: 16px; height: 16px; margin-top: 2px; }

/* markdown */
.content strong { color: var(--text-strong); }
.content code { padding: .1em .35em; border-radius: 4px; background: var(--bg-soft); font: 85% var(--mono); }
.content pre { margin: 6px 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-elev); overflow-x: auto; white-space: pre; }
.content pre code { padding: 0; background: none; font-size: 13px; }
.content blockquote { margin: 2px 0; padding-left: 12px; border-left: 4px solid var(--faint); }
.content .h1 { font-size: 22px; font-weight: 700; color: var(--text-strong); }
.content .h2 { font-size: 19px; font-weight: 700; color: var(--text-strong); }
.content .h3 { font-size: 16px; font-weight: 700; color: var(--text-strong); }
.content .sub { color: var(--muted); font-size: 12px; }
.content .mention { padding: 0 3px; border-radius: 4px; background: var(--mention); color: var(--link); font-weight: 500; cursor: pointer; }
.content .spoiler { border-radius: 4px; background: var(--faint); color: transparent; cursor: pointer; transition: .15s; }
.content .spoiler.open { background: var(--bg-soft); color: inherit; }
.content .ts { padding: 0 3px; border-radius: 4px; background: var(--bg-soft); }
.emoji { width: 22px; height: 22px; vertical-align: -5px; object-fit: contain; }
mark { border-radius: 3px; background: var(--mark); color: inherit; }

/* pièces jointes */
.media { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.media img, .media video { display: block; max-width: min(420px, 100%); max-height: 340px; border-radius: 10px; background: var(--bg-soft); }
.media img { cursor: zoom-in; object-fit: cover; }
.media audio { width: 320px; max-width: 100%; }
.file { display: flex; align-items: center; gap: 12px; width: min(420px, 100%); padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-elev); }
.file svg { width: 28px; height: 28px; color: var(--muted); flex: none; }
.file-text { min-width: 0; }
.file-name { display: block; overflow: hidden; color: var(--link); text-overflow: ellipsis; white-space: nowrap; }
.file-size { color: var(--faint); font-size: 12px; }
.missing { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 12px; }
.sticker { width: 160px; height: 160px; object-fit: contain; }
.sticker-name { display: inline-block; padding: 4px 10px; border-radius: 8px; background: var(--bg-soft); color: var(--muted); font-size: 13px; }

/* intégrations */
.embed { display: grid; gap: 6px; max-width: 520px; margin-top: 6px; padding: 10px 14px 12px; border-left: 4px solid var(--faint); border-radius: 6px; background: var(--bg-elev); }
.embed-provider { color: var(--muted); font-size: 12px; }
.embed-author { display: flex; align-items: center; gap: 8px; color: var(--text-strong); font-size: 13px; font-weight: 600; }
.embed-author img { width: 22px; height: 22px; border-radius: 50%; }
.embed-title { color: var(--text-strong); font-weight: 600; }
.embed-desc { color: var(--text); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.embed-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.embed-field b { display: block; color: var(--text-strong); font-size: 13px; }
.embed-field div { font-size: 13px; white-space: pre-wrap; }
.embed-img { max-width: 100%; max-height: 300px; border-radius: 6px; cursor: zoom-in; }
.embed-thumb { float: right; max-width: 80px; max-height: 80px; margin-left: 12px; border-radius: 6px; }

.reactions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.reaction { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-elev); color: var(--muted); font-size: 13px; font-weight: 600; }

.backdrop { position: fixed; inset: 0; z-index: 10; display: none; }
.backdrop.open { display: block; }
.profile { --p-bg: var(--bg-elev); --p-panel: var(--bg-soft); --p-text: var(--text); --p-strong: var(--text-strong); --p-muted: var(--muted);

    background: var(--p-bg); color: var(--p-text); box-shadow: var(--shadow); opacity: 0; transform: translateY(6px) scale(.98);

.profile.open { opacity: 1; transform: none; pointer-events: auto; }
.profile.themed { border-color: transparent; }

.p-badges img { width: 22px; height: 22px; object-fit: contain; }
.p-badges:empty { display: none; }
.p-head { display: grid; gap: 2px; }
.p-name { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; color: var(--p-strong); font-size: 20px; font-weight: 700; line-height: 1.2; word-break: break-word; }
.p-tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: 6px; background: var(--p-panel); color: var(--p-strong); font-size: 12px; font-weight: 700; }
.p-tag img { width: 14px; height: 14px; }
.p-user { color: var(--p-text); font-size: 14px; }

.p-card { display: grid; gap: 12px; padding: 12px; border-radius: 10px; background: var(--p-panel); }
.p-label { margin-bottom: 4px; color: var(--p-muted); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.p-bio { max-height: 200px; overflow-y: auto; color: var(--p-text); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.p-conn { display: flex; flex-wrap: wrap; gap: 6px; }

.p-id { color: var(--p-muted); font-family: var(--mono); font-size: 12px; }

.lb-next { right: 18px; }
.lb-close { position: absolute; top: 16px; right: 18px; color: #fff; font-size: 28px; line-height: 1; }

.jump { position: fixed; right: 26px; bottom: 22px; z-index: 5; display: none; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg-elev); color: var(--text-strong); font-size: 13px; box-shadow: var(--shadow); }

.loading { padding: 40px; color: var(--muted); text-align: center; }

@media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .side { display: none; }
    .search { width: auto; flex: 1; max-width: none; }
}
@media print {
    body { overflow: visible; }
    .app { display: block; height: auto; }
    .side, .top, .jump { display: none; }
    .scroll { overflow: visible; }
    .group { content-visibility: visible; }
}

            (conns ? "<div><div class=\"p-label\">" + esc(S("connections")) + "</div><div class=\"p-conn\">" + conns + "</div></div>" : "") +
            "<div><div class=\"p-label\">" + esc(S("inConv")) + "</div><div>" + esc(S("msgCount", (counts[id] || 0).toLocaleString(LOCALE))) + "</div></div>" +
            "<div><div class=\"p-label\">" + esc(S("user")) + "</div><div class=\"p-id\">" + esc(id) + "</div></div>" +
            "</div></div>";
        var r = anchor.getBoundingClientRect();
        var w = 340, hgt = Math.min(innerHeight - 24, profile.scrollHeight || 480);
        var left = r.right + 12, top = r.top - 20;
        if (left + w > innerWidth - 12) left = Math.max(12, r.left - w - 12);
        if (top + hgt > innerHeight - 12) top = Math.max(12, innerHeight - hgt - 12);
        profile.style.left = left + "px";
        profile.style.top = Math.max(12, top) + "px";
        profile.scrollTop = 0;
        profile.classList.add("open");
        backdrop.classList.add("open");
    }
    function closeProfile() { profile.classList.remove("open"); backdrop.classList.remove("open"); }
    backdrop.addEventListener("click", closeProfile);

    // Visionneuse
    var lb = $("lightbox"), lbImg = $("lbimg"), lbIndex = -1, lbItems = imagesList;
    function openImage(items, index) {
        lbItems = items; lbIndex = index;
        var it = items[index]; if (!it) return;
        lbImg.src = it.src;
        $("lbsave").href = it.src;
        $("lbsave").setAttribute("download", it.name || "image");
        $("lbprev").style.display = $("lbnext").style.display = items.length > 1 ? "" : "none";
        lb.classList.add("open");
    }
    function closeImage() { lb.classList.remove("open"); lbImg.removeAttribute("src"); }
    function step(d) { if (lbItems.length) openImage(lbItems, (lbIndex + d + lbItems.length) % lbItems.length); }
    $("lbclose").addEventListener("click", closeImage);
    $("lbprev").addEventListener("click", function () { step(-1); });
    $("lbnext").addEventListener("click", function () { step(1); });
    lb.addEventListener("click", function (e) { if (e.target === lb) closeImage(); });

    document.addEventListener("click", function (e) {
        var t = e.target;
        var zoom = t.closest("[data-zoom-src]");
        if (zoom) { closeProfile(); openImage([{ src: zoom.getAttribute("data-zoom-src"), name: "avatar" }], 0); return; }
        var u = t.closest("[data-user]");
        if (u && !t.closest(".profile")) { e.preventDefault(); openProfile(u.getAttribute("data-user"), u); return; }
        var im = t.closest("[data-img]");
        if (im) { openImage(imagesList, +im.getAttribute("data-img")); return; }
        var j = t.closest("[data-jump]");
        if (j) { goTo(j.getAttribute("data-jump")); return; }
        var sp = t.closest(".spoiler");
        if (sp) sp.classList.toggle("open");
    });
    document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") { closeImage(); closeProfile(); }
        if (lb.classList.contains("open")) { if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1); }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f") { e.preventDefault(); $("q").focus(); $("q").select(); }
    });

    // Recherche : surligne et passe d'un résultat à l'autre
    var hits = [], hit = -1, timer = null;
    function clearMarks() {
        document.querySelectorAll("mark[data-m]").forEach(function (mk) { var p = mk.parentNode; p.replaceChild(document.createTextNode(mk.textContent), mk); p.normalize(); });
    }
    function search() {
        clearMarks(); hits = []; hit = -1;
        var q = $("q").value.trim().toLowerCase();
        if (q.length < 2) { $("qcount").textContent = ""; return; }
        document.querySelectorAll("[data-text]").forEach(function (el) {
            if (el.textContent.toLowerCase().indexOf(q) < 0) return;
            var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), node, nodes = [];
            while ((node = walker.nextNode())) nodes.push(node);
            nodes.forEach(function (n) {
                var low = n.nodeValue.toLowerCase(), at = low.indexOf(q);
                while (at >= 0) {
                    var after = n.splitText(at); n = after.splitText(q.length);
                    var mk = document.createElement("mark"); mk.setAttribute("data-m", ""); mk.textContent = after.nodeValue;
                    after.parentNode.replaceChild(mk, after); hits.push(mk);
                    low = n.nodeValue.toLowerCase(); at = low.indexOf(q);
                }
            });
        });
        $("qcount").textContent = hits.length ? "" : S("noResult");
        if (hits.length) move(hits.length - 1);
    }
    function move(i) {
        if (!hits.length) return;
        hit = (i + hits.length) % hits.length;
        hits[hit].scrollIntoView({ block: "center" });
        $("qcount").textContent = (hit + 1) + " / " + hits.length;
        var msg = hits[hit].closest(".msg"); if (msg) { msg.classList.remove("flash"); void msg.offsetWidth; msg.classList.add("flash"); }
    }
    $("q").addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(search, 250); });
    $("q").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); move(hit + (e.shiftKey ? 1 : -1)); } });
    $("qprev").addEventListener("click", function () { move(hit - 1); });
    $("qnext").addEventListener("click", function () { move(hit + 1); });

    // Thème
    var root = document.documentElement;
    try { if (localStorage.getItem("lc-export-theme") === "light") root.classList.add("light"); } catch (e) { }
    $("theme").addEventListener("click", function () {
        root.classList.toggle("light");
        try { localStorage.setItem("lc-export-theme", root.classList.contains("light") ? "light" : "dark"); } catch (e) { }
    });
})();
</script>
</body>
</html>
