[package]
name = "low-musical-engine"
version = "0.1.0"
description = "Moteur audio de low-musical : diffuse de l'audio dans un salon vocal Discord"
authors = ["shitday"]
edition = "2021"
publish = false

# Moteur lancé par low-cord (processus principal de Discord). Il ne parle
# qu'à lui, par son entrée/sortie standard : une commande JSON par ligne en
# entrée, une réponse ou un événement JSON par ligne en sortie. Rien n'écoute
# sur le réseau local. Quand low-cord se ferme, l'entrée se ferme et le moteur
# quitte le vocal puis s'arrête.
#
# Prérequis de build : cmake + compilateur C++ MSVC (songbird compile Opus).

[[bin]]
name = "low-musical-engine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde_json = "1"
# Capture d'un périphérique d'entrée (câble virtuel, micro).
cpal = "0.15"
# songbird embarque symphonia SANS codec : "pcm" est requis par RawAdapter
# (notre source live est du PCM f32), l'unification des features de Cargo
# l'active pour songbird aussi.
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }
# driver = vocal + chiffrement DAVE + Opus ; native = TLS Windows (schannel) ;
# tungstenite = backend WebSocket du driver. Pas de serenity : on fait notre
# propre gateway.
songbird = { version = "0.6", default-features = false, features = ["driver", "native", "tungstenite"] }

[profile.release]
# Audio temps réel : on optimise pour la vitesse, pas la taille.
opt-level = 3
lto = true
codegen-units = 1
strip = true
